name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Known-vulnerable runtime dependencies fail the build.
      - run: npm audit --omit=dev --audit-level=high
  lite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the free generator and demo, then test them in a browser
        run: npm run test:e2e
      - name: Verify Super Admin account grants in a browser
        run: |
          npm run build
          npx playwright test visual/admin-access.spec.js
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check hosted quotas, privacy, signup and admin controls
        run: npm run test:hosted
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image and check that it becomes ready
        run: |
          docker build -t openqr:ci .
          docker run -d --name openqr -p 3001:3001 \
            -e PUBLIC_URL=http://localhost:3001 -e COOKIE_SECURE=false openqr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs openqr
          exit 1
