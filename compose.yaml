services:
  openqr:
    build: .
    ports:
      - "3001:3001"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - openqr-data:/app/data
    restart: unless-stopped
volumes:
  openqr-data:
